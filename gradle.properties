# JVM settings
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 built-in Kotlin (default, explicit for clarity)
android.builtInKotlin=true

# AGP 9 defaults to the new Android DSL, which removes the legacy BaseExtension
# that the Hilt Gradle plugin (2.56.x) still requires. Opt back into the legacy
# DSL until a Hilt release supports the new DSL (removed in AGP 10).
android.newDsl=false

kotlin.code.style=official
